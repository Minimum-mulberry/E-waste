<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - E-Waste Pickup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">E-Waste Pickup</a>
      <div class="nav-links">
        <a href="index.html">Login</a>
        <a href="register.html">Register</a>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <div class="box" style="max-width: 420px; margin: 30px auto;">
      <h1>Login</h1>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter password">
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" required>
            <option value="Donor">Donor</option>
            <option value="Collector">Collector</option>
            <option value="Admin">Admin</option>
          </select>
        </div>

        <div class="form-group">
          <button type="submit" class="btn" style="width: 100%;">Login</button>
        </div>
      </form>

      <p class="help-text">
        Don't have an account? <a href="register.html">Register here</a>
      </p>

      <div class="help-text" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
        <strong>Demo accounts:</strong><br>
        Donor: donor@test.com<br>
        Collector: collector@test.com<br>
        Admin: admin@test.com
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="index.js"></script>
</body>
</html>
