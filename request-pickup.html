<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Pickup - E-Waste Pickup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="donor-dashboard.html" class="brand">E-Waste Pickup</a>
      <div class="nav-links">
        <a href="donor-dashboard.html">My Pickups</a>
        <a href="request-pickup.html">New Request</a>
        <a href="rewards.html">Rewards</a>
        <a href="javascript:void(0)" onclick="logout()">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container">
    <div class="box" style="max-width: 550px; margin: 20px auto;">
      <h1>Schedule E-Waste Pickup</h1>

      <form id="requestPickupForm">
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <!-- Loaded dynamically from data.js -->
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" min="1" value="1" required placeholder="Number of items">
        </div>

        <div class="form-group">
          <label for="weight">Estimated Weight (kg)</label>
          <input type="number" id="weight" step="0.1" min="0.1" required placeholder="e.g. 1.5">
          <span class="help-text">Points are awarded based on weight x reward rate per kg.</span>
        </div>

        <div class="form-group">
          <label for="pickup_address">Pickup Address</label>
          <textarea id="pickup_address" required placeholder="Full street address, flat/house number, city"></textarea>
        </div>

        <div class="form-group">
          <label for="pickup_date">Pickup Date</label>
          <input type="date" id="pickup_date" required>
        </div>

        <div class="form-group">
          <label for="pickup_time">Pickup Time</label>
          <input type="time" id="pickup_time" required>
        </div>

        <div class="form-group" style="margin-top: 20px;">
          <button type="submit" class="btn">Submit Request</button>
          <a href="donor-dashboard.html" class="btn btn-secondary" style="margin-left: 10px;">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="request-pickup.js"></script>
</body>
</html>
